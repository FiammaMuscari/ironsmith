[package]
name = "ironsmith-registry-sync"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
ironsmith-card-source = { path = "../ironsmith-card-source", default-features = false }
# Keep the bundled SQLite feature enabled so the registry preflight also builds
# on Windows hosts that do not have a system sqlite3.lib installed.
ironsmith-status-db = { path = "../ironsmith-status-db" }
serde_json = "1.0.149"

[[bin]]
name = "sync_registry_db"
path = "src/main.rs"
test = false
